<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var nombre = ["Julián", "Rodrigo", "Mateo", "Valdomero"]
        nombre.sort()
        var nombreReves = nombre.map((x) => x)
        nombreReves.reverse()
        for (let i = 0; i < nombre.length; i++) {
            document.write(nombre[i])
        }
        document.write("<br><br>")
        for (let i = 0; i < nombre.length; i++) {
            document.write(nombreReves[i])
        }

    </script>
</body>
</html>
