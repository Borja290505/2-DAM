<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        table {
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            width: 40px;
            height: 40px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f0f0f0;
            font-weight: bold;
        }
        .festivo {
            background-color: #ffcccc;
            color: #cc0000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2 id="month-title"></h2>
    <div id="calendar"></div>

    <script>
        
        var festivos = [[1, 6], [], [], [2, 3], [1, 2, 15], [], [], [15], [], [12], [2, 9], [7, 8, 25]]
; 
        const nombresMes = [
            "Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
            "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        const diasSemana = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
    
        let seleccion = prompt("Introduce el número del mes que deseas ver (1 al 12):");
        let numMes = parseInt(seleccion) - 1;

        if (isNaN(numMes) || numMes < 0 || numMes > 11) {
            alert("Por favor, introduce un número válido entre 1 y 12.");
        } else {
            generarCalendario(numMes, 2026);
        }

        function generarCalendario(mes, anio) {
            //Definimos el calendario y el titulo que va ha ser el mes
            const tabla = document.getElementById("calendar");
            const titulo = document.getElementById("month-title");
            
            
            tabla.innerHTML = "";

            //Que en el titulo ponga el mes y el año que se desea buscar
            titulo.innerText = `${nombresMes[mes]} ${anio}`;

        
            const filaCabecera = document.createElement("tr");


            diasSemana.forEach(dia => {
                const th = document.createElement("th");
                th.innerText = dia;
                filaCabecera.appendChild(th);
            });
            2
            tabla.appendChild(filaCabecera);

           
            const primerDiaSemana = new Date(anio, mes, 1).getDay();
            const totalDias = new Date(anio, mes + 1, 0).getDate();

            
            let filaActual = document.createElement("tr");

            // 2. Rellenar los huecos vacíos de la primera semana
            for (let i = 0; i < primerDiaSemana; i++) {
                const tdVacio = document.createElement("td");
                filaActual.appendChild(tdVacio);
            }

            // 3. Rellenar los días del mes
            for (let dia = 1; dia <= totalDias; dia++) {
                // Si la fila actual ya tiene 7 columnas, la añadimos a la tabla y creamos una nueva
                if (filaActual.children.length === 7) {
                    tabla.appendChild(filaActual);
                    filaActual = document.createElement("tr");
                }

                const tdDia = document.createElement("td");
                tdDia.innerText = dia;

                // Comprobar si es festivo
                if (festivos[mes].includes(dia)) {
                    tdDia.className = "festivo";
                }

                filaActual.appendChild(tdDia);
            }

            // 4. Completar con celdas vacías la última semana si se queda incompleta
            while (filaActual.children.length < 7) {
                const tdVacio = document.createElement("td");
                filaActual.appendChild(tdVacio);
            }
            
            // Añadir la última fila procesada a la tabla
            tabla.appendChild(filaActual);
        }
    </script>
</body>
</html>
