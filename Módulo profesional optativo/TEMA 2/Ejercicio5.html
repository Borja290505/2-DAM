<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script type="text/javascript">
        let numero1 = prompt("Introduceme un numero")
        let numero2 = prompt("Introduceme un numero")

        if(numero1>numero2){
            document.write("El numero " + numero1 + " es el mayor")
        }else if(numero2>numero1){
            document.write("El numero " + numero2 + " es el mayor")
        }else{
            document.write("Lo numeros son iguales")
        }
    </script>
</body>
</html>
