<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero = prompt("Introduceme un numero")
        var factorial = 1
        for(var i = 1; i<=numero;i++){
            factorial*=i
        }
        document.write("El factorial de " + numero + " es " + factorial)
    </script>
</body>
</html>
