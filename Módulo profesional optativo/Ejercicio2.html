<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let numero = prompt("Introduceme un numero");

        if (parseInt(numero)%2==0) {
            document.write("Es par " + numero)
        }else{
            document.write("No es par " + numero)
        }
    </script>
</body>
</html>
