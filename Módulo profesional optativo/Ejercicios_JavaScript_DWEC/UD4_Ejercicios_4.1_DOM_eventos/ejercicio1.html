<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Lista de números aleatorios</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2em; line-height: 1.5; }
        .enunciado { background: #f4f4f4; border-left: 5px solid #f0db4f; padding: 0.6em 1em; }
        button { font-size: 1.1em; padding: 0.4em 1.2em; cursor: pointer; }
        li { font-size: 1.1em; }
    </style>
    
    <!-- defer: el script se ejecuta cuando el HTML ya está cargado -->
    <script src="ejercicio1.js" defer></script>
</head>
<body>
    <h1>Ejercicio 1</h1>
    <p class="enunciado">Al pulsar el botón "Nuevo número" se añade un elemento con un número aleatorio
        a una lista desordenada (elemento <code>&lt;ul&gt;</code>).</p>

    <button id="nuevo">Nuevo número</button>

    <ul id="lista"></ul>
</body>
</html>
