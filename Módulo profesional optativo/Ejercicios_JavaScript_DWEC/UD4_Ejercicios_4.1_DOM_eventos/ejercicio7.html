<body>
    <h1>Ejercicio 7</h1>
    <p class="enunciado">Al pulsar una tecla, calcula cuántos DNIs de 4 cifras (del 0001 al 9999) tienen esa letra
        y muestra los DNIs con sus letras en un elemento <code>&lt;p&gt;</code>.</p>

    <p id="titulo">Pulsa una letra del teclado</p>
