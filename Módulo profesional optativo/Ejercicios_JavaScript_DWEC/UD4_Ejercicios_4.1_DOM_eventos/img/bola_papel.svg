<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Bola de papel arrugada -->
  <defs>
    <radialGradient id="luz" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#ececea"/>
      <stop offset="100%" stop-color="#cfcfca"/>
    </radialGradient>
  </defs>
  <!-- sombra en el suelo -->
  <ellipse cx="60" cy="113" rx="38" ry="5" fill="#000" opacity="0.12"/>
  <!-- contorno de la bola -->
  <path d="M58,8 L80,12 L97,26 L109,47 L108,70 L98,90 L80,104 L57,108 L35,101 L18,86 L10,64 L13,40 L26,21 L42,11 Z"
        fill="url(#luz)" stroke="#8d8d86" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- caras un poco más claras u oscuras para dar volumen -->
  <path d="M60,62 L86,55 L98,90 L80,104 Z" fill="#000" opacity="0.06"/>
  <path d="M30,52 L60,62 L44,80 L18,86 Z" fill="#000" opacity="0.05"/>
  <path d="M68,32 L86,55 L60,62 L48,34 Z" fill="#fff" opacity="0.6"/>
  <!-- pliegues del papel -->
  <g fill="none" stroke="#a9a9a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="42,11 48,34 30,52 18,86"/>
    <polyline points="80,12 68,32 48,34"/>
    <polyline points="109,47 86,55 68,32"/>
    <polyline points="86,55 98,90"/>
    <polyline points="48,34 60,62 86,55"/>
    <polyline points="60,62 57,108"/>
    <polyline points="30,52 60,62"/>
    <polyline points="60,62 80,104"/>
    <polyline points="13,40 30,52"/>
    <polyline points="35,101 44,80 60,62"/>
  </g>
  <!-- restos de líneas escritas -->
  <g stroke="#7aa0d6" stroke-width="1.3" opacity="0.6" stroke-linecap="round">
    <line x1="53" y1="42" x2="66" y2="40"/>
    <line x1="54" y1="47" x2="72" y2="45"/>
    <line x1="34" y1="62" x2="48" y2="66"/>
    <line x1="68" y1="70" x2="86" y2="66"/>
  </g>
</svg>
