<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Papelera vacía -->
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6c7a87"/>
      <stop offset="0.35" stop-color="#b3c0cb"/>
      <stop offset="0.6" stop-color="#8795a2"/>
      <stop offset="1" stop-color="#5b6875"/>
    </linearGradient>
  </defs>
  <!-- sombra en el suelo -->
  <ellipse cx="80" cy="192" rx="52" ry="6" fill="#000" opacity="0.15"/>
  <!-- cuerpo -->
  <path d="M18,42 L142,42 L126,186 Q80,196 34,186 Z" fill="url(#metal)" stroke="#46525e" stroke-width="3" stroke-linejoin="round"/>
  <!-- ranuras -->
  <g stroke="#55626f" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="46" y1="64" x2="53" y2="174"/>
    <line x1="80" y1="64" x2="80" y2="178"/>
    <line x1="114" y1="64" x2="107" y2="174"/>
  </g>
  <!-- boca de la papelera: está vacía, se ve el fondo oscuro -->
  <ellipse cx="80" cy="42" rx="62" ry="15" fill="#2f363d"/>
  <ellipse cx="80" cy="46" rx="52" ry="9" fill="#22282d"/>
  <!-- borde superior -->
  <ellipse cx="80" cy="42" rx="64" ry="16" fill="none" stroke="#c9d2da" stroke-width="5"/>
  <ellipse cx="80" cy="42" rx="66.5" ry="18.5" fill="none" stroke="#46525e" stroke-width="1.5"/>
</svg>
