<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" width="160" height="200">
  <!-- Papelera llena de papeles -->
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6c7a87"/>
      <stop offset="0.35" stop-color="#b3c0cb"/>
      <stop offset="0.6" stop-color="#8795a2"/>
      <stop offset="1" stop-color="#5b6875"/>
    </linearGradient>
    <radialGradient id="luz" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ecece8"/>
      <stop offset="100%" stop-color="#d2d2cc"/>
    </radialGradient>
    <!-- Una bola de papel (se reutiliza varias veces con <use>) -->
    <g id="bola">
      <path d="M58,8 L80,12 L97,26 L109,47 L108,70 L98,90 L80,104 L57,108 L35,101 L18,86 L10,64 L13,40 L26,21 L42,11 Z"
            fill="url(#luz)" stroke="#8d8d86" stroke-width="5" stroke-linejoin="round"/>
      <g fill="none" stroke="#a9a9a2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="42,11 48,34 30,52 18,86"/>
        <polyline points="80,12 68,32 48,34"/>
        <polyline points="109,47 86,55 68,32"/>
        <polyline points="48,34 60,62 86,55"/>
        <polyline points="60,62 57,108"/>
        <polyline points="30,52 60,62"/>
      </g>
    </g>
    <!-- Lo que hay dentro solo se ve por encima del borde delantero de la papelera -->
    <clipPath id="dentro">
      <rect x="0" y="0" width="160" height="42"/>
      <ellipse cx="80" cy="42" rx="62" ry="15"/>
    </clipPath>
  </defs>

  <!-- sombra en el suelo -->
  <ellipse cx="80" cy="192" rx="52" ry="6" fill="#000" opacity="0.15"/>
  <!-- cuerpo -->
  <path d="M18,42 L142,42 L126,186 Q80,196 34,186 Z" fill="url(#metal)" stroke="#46525e" stroke-width="3" stroke-linejoin="round"/>
  <!-- ranuras -->
  <g stroke="#55626f" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="46" y1="64" x2="53" y2="174"/>
    <line x1="80" y1="64" x2="80" y2="178"/>
    <line x1="114" y1="64" x2="107" y2="174"/>
  </g>
  <!-- boca de la papelera -->
  <ellipse cx="80" cy="42" rx="62" ry="15" fill="#2f363d"/>

  <!-- papeles que asoman -->
  <g clip-path="url(#dentro)">
    <!-- una hoja doblada -->
    <path d="M94,52 L104,4 L128,10 L118,54 Z" fill="#fbfbf7" stroke="#8d8d86" stroke-width="2" stroke-linejoin="round"/>
    <g stroke="#7aa0d6" stroke-width="1.3" opacity="0.6" stroke-linecap="round">
      <line x1="106" y1="14" x2="123" y2="18"/>
      <line x1="104" y1="21" x2="121" y2="25"/>
      <line x1="102" y1="28" x2="119" y2="32"/>
      <line x1="100" y1="35" x2="114" y2="38"/>
    </g>
    <!-- bolas de papel -->
    <use href="#bola" transform="translate(24,20) scale(0.34)"/>
    <use href="#bola" transform="translate(98,24) scale(0.3)"/>
    <use href="#bola" transform="translate(52,6) scale(0.4)"/>
    <use href="#bola" transform="translate(40,30) scale(0.3)"/>
    <use href="#bola" transform="translate(74,30) scale(0.32)"/>
  </g>

  <!-- borde superior (por delante de los papeles) -->
  <ellipse cx="80" cy="42" rx="64" ry="16" fill="none" stroke="#c9d2da" stroke-width="5"/>
  <ellipse cx="80" cy="42" rx="66.5" ry="18.5" fill="none" stroke="#46525e" stroke-width="1.5"/>
</svg>
