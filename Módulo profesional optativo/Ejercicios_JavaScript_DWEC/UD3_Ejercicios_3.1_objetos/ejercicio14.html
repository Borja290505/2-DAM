<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14 - ¿Año bisiesto?</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2em; line-height: 1.5; }
        .enunciado { background: #f4f4f4; border-left: 5px solid #f0db4f; padding: 0.6em 1em; }
        input, button { font-size: 1.1em; padding: 0.3em 0.6em; }
        #resultado { font-size: 1.3em; margin-top: 1em; }
    </style>
</head>
<body>
    <h1>Ejercicio 14</h1>
    <p class="enunciado">Script que dice si una fecha es de un año bisiesto.</p>

    <label for="fecha">Fecha:</label>
    <input type="date" id="fecha">
    <button onclick="comprobar()">Comprobar</button>

    <p id="resultado"></p>

    <script>
        // Añade un 0 delante si el número tiene una sola cifra: 5 → "05"
        function dosCifras(numero) {
            return String(numero).padStart(2, "0");
        }

        // Usamos un objeto Date: si el 29 de febrero de ese año existe, el año es bisiesto.
        // Si no existe, JavaScript lo convierte en el 1 de marzo y el mes ya no es febrero (1).
        // (Es lo mismo que la regla: divisible entre 4 y no entre 100, o divisible entre 400)
        function esBisiesto(anyo) {
            let veintinueveDeFebrero = new Date(anyo, 1, 29);   // mes 1 = febrero
            return veintinueveDeFebrero.getMonth() === 1;
        }

        function comprobar() {
            let valor = document.getElementById("fecha").value;   // "aaaa-mm-dd"
            let resultado = document.getElementById("resultado");

            if (valor === "") {
                resultado.textContent = "Elige primero una fecha.";
                return;
            }

            let partes = valor.split("-");
            let fecha = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
            let anyo = fecha.getFullYear();

            let textoFecha = dosCifras(fecha.getDate()) + "-" + dosCifras(fecha.getMonth() + 1) + "-" + anyo;

            if (esBisiesto(anyo)) {
                resultado.innerHTML = "La fecha " + textoFecha + " <strong>SÍ es de un año bisiesto</strong>: " +
                                      anyo + " tiene 366 días (existe el 29 de febrero).";
            } else {
                resultado.innerHTML = "La fecha " + textoFecha + " <strong>NO es de un año bisiesto</strong>: " +
                                      anyo + " tiene 365 días.";
            }
        }

        // Al cargar la página ponemos la fecha de hoy y la comprobamos
        let hoy = new Date();
        document.getElementById("fecha").value =
            hoy.getFullYear() + "-" + dosCifras(hoy.getMonth() + 1) + "-" + dosCifras(hoy.getDate());
        comprobar();
    </script>
</body>
</html>
