<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Pirámide de números</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2em; line-height: 1.5; }
        .enunciado { background: #f4f4f4; border-left: 5px solid #f0db4f; padding: 0.6em 1em; }
        .figura { font-family: "Courier New", monospace; font-size: 1.6em; line-height: 1.3; }
    </style>
</head>
<body>
    <h1>Ejercicio 8</h1>
    <p class="enunciado">Script que genera una pirámide de números: 1, 22, 333, 4444, 55555.</p>

    <script>
        // Número de filas de la pirámide
        const FILAS = 5;

        let piramide = "";

        // Bucle exterior: una vuelta por cada fila (1, 2, 3, 4 y 5)
        for (let fila = 1; fila <= FILAS; fila++) {
            // Bucle interior: escribimos el número de la fila tantas veces como vale
            for (let veces = 1; veces <= fila; veces++) {
                piramide += fila;
            }
            piramide += "<br>";   // salto de línea al terminar cada fila
        }

        document.write("<p class='figura'>" + piramide + "</p>");
    </script>
</body>
</html>
