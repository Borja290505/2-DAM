<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 - Figura de impares</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2em; line-height: 1.5; }
        .enunciado { background: #f4f4f4; border-left: 5px solid #f0db4f; padding: 0.6em 1em; }
        .aviso { color: #b00020; }
        pre { font-size: 1.6em; line-height: 1.3; }
    </style>
</head>
<body>
    <h1>Ejercicio 13</h1>
    <div class="enunciado">
        <p>Script que pide un número y muestra esta estructura hasta el impar más próximo al número.
            Ejemplo para el 8:</p>
        <pre style="font-size: 1em">***1***
**333**
*55555*
7777777</pre>
    </div>

    <script>
        // Pide un número entero entre minimo y maximo (incluidos).
        // Si no es válido lo vuelve a pedir. Devuelve null si el usuario pulsa "Cancelar".
        function pedirEntero(mensaje, minimo, maximo) {
            let texto = prompt(mensaje);
            while (texto !== null) {
                let numero = Number(texto);
                if (texto.trim() !== "" && Number.isInteger(numero) && numero >= minimo && numero <= maximo) {
                    return numero;
                }
                texto = prompt("«" + texto + "» no es válido.\n" + mensaje);
            }
            return null;
        }

        // Limitamos a números de una cifra (del 1 al 10 → impar máximo 9)
        // para que la figura quede bien alineada.
        let numero = pedirEntero("Introduce un número del 1 al 10:", 1, 10);

        if (numero === null) {
            document.write("<p class='aviso'>Has cancelado. Recarga la página (F5) para empezar de nuevo.</p>");
        } else {
            // Impar más próximo: si el número es par, el impar de debajo (para el 8 → 7, como en el ejemplo)
            let maximo;
            if (numero % 2 === 0) {
                maximo = numero - 1;
            } else {
                maximo = numero;
            }

            let figura = "";

            // Una fila por cada impar: 1, 3, 5, 7...
            for (let impar = 1; impar <= maximo; impar += 2) {
                // Asteriscos a cada lado para que todas las filas midan lo mismo que la última
                let asteriscos = (maximo - impar) / 2;
                let linea = "";

                for (let i = 0; i < asteriscos; i++) {
                    linea += "*";
                }
                for (let i = 0; i < impar; i++) {     // el impar repetido tantas veces como vale
                    linea += impar;
                }
                for (let i = 0; i < asteriscos; i++) {
                    linea += "*";
                }

                figura += linea + "\n";
            }

            document.write("<p>Número introducido: <strong>" + numero + "</strong> → impar más próximo: <strong>" + maximo + "</strong></p>");
            // <pre> respeta los saltos de línea y usa letra de ancho fijo
            document.write("<pre>" + figura + "</pre>");
        }
    </script>
</body>
</html>
