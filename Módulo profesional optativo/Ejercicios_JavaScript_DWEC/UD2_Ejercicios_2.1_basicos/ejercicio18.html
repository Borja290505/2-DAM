<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 - Impares sin usar %</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 2em; line-height: 1.5; }
        .enunciado { background: #f4f4f4; border-left: 5px solid #f0db4f; padding: 0.6em 1em; }
        .aviso { color: #b00020; }
    </style>
</head>
<body>
    <h1>Ejercicio 18</h1>
    <p class="enunciado">Script que, dado un número, muestra todos los impares hasta ese número
        sin usar el operador módulo (<code>%</code>).</p>

    <script>
        // Pide un número entero entre minimo y maximo (incluidos).
        // Si no es válido lo vuelve a pedir. Devuelve null si el usuario pulsa "Cancelar".
        function pedirEntero(mensaje, minimo, maximo) {
            let texto = prompt(mensaje);
            while (texto !== null) {
                let numero = Number(texto);
                if (texto.trim() !== "" && Number.isInteger(numero) && numero >= minimo && numero <= maximo) {
                    return numero;
                }
                texto = prompt("«" + texto + "» no es válido.\n" + mensaje);
            }
            return null;
        }

        let numero = pedirEntero("Introduce un número entero positivo (de 1 a 10000):", 1, 10000);

        if (numero === null) {
            document.write("<p class='aviso'>Has cancelado. Recarga la página (F5) para empezar de nuevo.</p>");
        } else {
            let impares = "";
            let cantidad = 0;

            // Sin usar %: empezamos en el 1 (que es impar) y vamos sumando 2,
            // así siempre saltamos de un impar al siguiente: 1, 3, 5, 7...
            for (let i = 1; i <= numero; i += 2) {
                if (cantidad > 0) {
                    impares += ", ";
                }
                impares += i;
                cantidad++;
            }

            document.write("<p>Impares del 1 al " + numero + " (" + cantidad + " en total):</p>");
            document.write("<p><strong>" + impares + "</strong></p>");
        }
    </script>
</body>
</html>
